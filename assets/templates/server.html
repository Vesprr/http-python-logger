<!DOCTYPE html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <title>Logger Dashboard</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = { darkMode: "class" };
        </script>
        <style>
            body {
                font-family: ui-sans-serif, system-ui, -apple-system,
                    BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                    Arial, "Noto Sans", sans-serif;
            }
            .terminal {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                    Consolas, "Liberation Mono", "Courier New", monospace;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            .chip {
                cursor: pointer;
                transition: all 0.2s;
            }
        </style>
    </head>
    <body
        class="bg-zinc-50 dark:bg-zinc-900 h-screen flex flex-col text-zinc-800 dark:text-zinc-200"
    >
        <!-- Header -->
        <header
            class="p-4 bg-zinc-200 dark:bg-zinc-800 border-b border-zinc-300 dark:border-zinc-700 flex items-center justify-between"
        >
            <h1 class="font-semibold text-lg">Logger Dashboard</h1>
            <div class="flex items-center space-x-2">
                <button
                    id="themeToggle"
                    class="px-3 py-1 rounded text-sm bg-zinc-300 dark:bg-zinc-700 hover:bg-zinc-400 dark:hover:bg-zinc-600"
                >
                    Light
                </button>
                <button
                    id="clearBtn"
                    class="px-3 py-1 rounded text-sm bg-zinc-300 dark:bg-zinc-700 hover:bg-zinc-400 dark:hover:bg-zinc-600"
                >
                    Clear Logs
                </button>
                <div
                    id="status"
                    class="px-3 py-1 rounded text-sm bg-zinc-300 dark:bg-zinc-700"
                >
                    Disconnected
                </div>
            </div>
        </header>

        <!-- Logger chips -->
        <div
            id="loggerChips"
            class="p-3 bg-zinc-100 dark:bg-zinc-800 flex flex-wrap gap-2 border-b border-zinc-300 dark:border-zinc-700"
        >
            <div
                class="chip px-3 py-1 rounded-full border border-zinc-400 dark:border-zinc-600 text-sm"
                data-id="all"
            >
                All
            </div>
            <div
                class="chip px-3 py-1 rounded-full border border-zinc-400 dark:border-zinc-600 text-sm"
                data-id="65535"
            >
                Meta
            </div>
            {{#m_loggers}}
            <div
                class="chip px-3 py-1 rounded-full border border-zinc-400 dark:border-zinc-600 text-sm"
                data-id="{{id}}"
            >
                {{name}}
            </div>
            {{/m_loggers}}
        </div>

        <!-- Stats -->
        <div
            class="p-2 bg-zinc-100 dark:bg-zinc-800 border-b border-zinc-300 dark:border-zinc-700 text-xs text-zinc-600 dark:text-zinc-400"
        >
            <div class="flex flex-row gap-2">
                <div id="receivedLocal">Received from [All]: 0</div>
                <div id="receivedTotal">Received Total: 0</div>
            </div>
        </div>

        <!-- Terminal -->
        <main
            id="messages"
            class="flex-1 overflow-y-auto p-4 bg-zinc-50 dark:bg-zinc-900 terminal text-sm flex flex-col"
        ></main>

        <script>
            /* --------------------- State --------------------- */
            let ws, recvCount = 0;
            const selectedLoggers = new Set();
            const messageCache = {};
            const loggerNames = {65535: "Meta"};
            {{#m_loggers}}
            loggerNames[{{id}}] = "{{name}}";
            {{/m_loggers}}

            /* --------------------- DOM --------------------- */
            const messages = document.getElementById("messages");
            const status = document.getElementById("status");
            const receivedLocal = document.getElementById("receivedLocal");
            const receivedTotal = document.getElementById("receivedTotal");
            const clearBtn = document.getElementById("clearBtn");
            const themeToggle = document.getElementById("themeToggle");
            const loggerChips = document.getElementById("loggerChips");

            /* --------------------- Theme --------------------- */
            if (localStorage.theme === "light") document.documentElement.classList.remove("dark"), themeToggle.textContent="Dark";
            else document.documentElement.classList.add("dark"), themeToggle.textContent="Light";

            themeToggle.onclick = () => {
                if (document.documentElement.classList.contains("dark")) {
                    document.documentElement.classList.remove("dark"); localStorage.theme="light"; themeToggle.textContent="Dark";
                } else {
                    document.documentElement.classList.add("dark"); localStorage.theme="dark"; themeToggle.textContent="Light";
                }
            };

            /* --------------------- Helpers --------------------- */
            function addMessageToCache(id, msg) {
                id = Number(id);
                if (!messageCache[id]) messageCache[id] = [];
                messageCache[id].push({id, msg});
                if (messageCache[id].length > 200) messageCache[id].shift();
                if (selectedLoggers.has(id)) renderMessage(id, msg);
            }

            function renderMessage(id, msg) {
                const line = document.createElement("div");
                const levelMatch = msg.match(/\[(INFO|WARN|ERROR|[A-Z]+)\]/);
                const level = levelMatch ? levelMatch[1] : "INFO";

                const colors = {
                    INFO: {bg:"bg-green-200 dark:bg-green-900/40", text:"text-green-800 dark:text-green-200", hover:"hover:bg-green-300 dark:hover:bg-green-800/60"},
                    WARN: {bg:"bg-yellow-200 dark:bg-yellow-900/40", text:"text-yellow-800 dark:text-yellow-200", hover:"hover:bg-yellow-300 dark:hover:bg-yellow-800/60"},
                    ERROR: {bg:"bg-red-200 dark:bg-red-900/40", text:"text-red-800 dark:text-red-200", hover:"hover:bg-red-300 dark:hover:bg-red-800/60"}
                };

                if (colors[level]) {
                    const {bg, text, hover} = colors[level];
                    line.className=`block px-2 py-1 cursor-default transition mx-0.5 ${bg} ${text} ${hover}`;
                    line.textContent = msg;
                } else {
                    line.style.backgroundColor = "rgba(128,0,128,0.2)";
                    line.style.color = "purple";
                    line.style.padding = "0.25rem 0.5rem";
                    line.style.margin = "0.125rem";
                    line.style.cursor = "default";
                    line.style.transition = "all 0.2s";
                    line.textContent = msg;
                }
                messages.prepend(line);
            }

            function updateStats() {
                let total=0, localCount=0;
                const allChip = loggerChips.querySelector('.chip[data-id="all"]');
                const loggerChipsArray = Array.from(loggerChips.querySelectorAll(".chip")).filter(c=>c.dataset.id!=="all");
                const selectedCount = loggerChipsArray.filter(c=>selectedLoggers.has(Number(c.dataset.id))).length;

                for(const id of selectedLoggers){ localCount += messageCache[id]?.length||0; }

                receivedLocal.textContent = selectedCount===loggerChipsArray.length ? `Received from [All]: ${localCount}` : `Received from [${Array.from(selectedLoggers).map(id=>loggerNames[id]||id).join(", ")}]: ${localCount}`;
                for(const key in messageCache) total+=messageCache[key].length;
                receivedTotal.textContent=`Received Total: ${total}`;
            }

            function updateChips() {
                const allChip = loggerChips.querySelector('.chip[data-id="all"]');
                const loggerChipsArray = Array.from(loggerChips.querySelectorAll(".chip")).filter(c=>c.dataset.id!=="all");
                const totalCount = loggerChipsArray.length;
                const selectedCount = loggerChipsArray.filter(c=>selectedLoggers.has(Number(c.dataset.id))).length;

                allChip.className="chip px-3 py-1 rounded-full border text-sm border-zinc-400 dark:border-zinc-600";
                if(selectedCount===totalCount) allChip.classList.add("bg-blue-500","text-white","dark:bg-blue-600","dark:text-white");
                else if(selectedCount>0) allChip.classList.add("border-blue-500","dark:border-blue-600");

                loggerChipsArray.forEach(c => {
                    const cid = Number(c.dataset.id);
                    c.classList.remove("bg-blue-500", "text-white", "dark:bg-blue-600", "dark:text-white");
                    if (selectedLoggers.has(cid)) {
                        c.classList.add("bg-blue-500", "text-white", "dark:bg-blue-600", "dark:text-white");
                    }
                });
            }

            function sortChips() {
                const chips = Array.from(loggerChips.querySelectorAll(".chip"));
                const allChip = chips.find(c=>c.dataset.id==="all");
                const metaChip = chips.find(c=>c.dataset.id==="65535");
                const loggerArray = chips.filter(c=>c!==allChip && c!==metaChip).sort((a,b)=>Number(a.dataset.id)-Number(b.dataset.id));
                loggerChips.innerHTML="";
                if(allChip) loggerChips.appendChild(allChip);
                loggerArray.forEach(c=>loggerChips.appendChild(c));
                if(metaChip) loggerChips.appendChild(metaChip);
            }

            /* --------------------- Chip selection --------------------- */
            loggerChips.addEventListener("click", e=>{
                const chip = e.target.closest(".chip");
                if(!chip) return;
                const id = chip.dataset.id;

                if(id==="all"){
                    const allSelected = Array.from(loggerChips.querySelectorAll(".chip")).filter(c=>c.dataset.id!=="all").every(c=>selectedLoggers.has(Number(c.dataset.id)));
                    selectedLoggers.clear();
                    if(!allSelected) loggerChips.querySelectorAll(".chip").forEach(c=>{if(c.dataset.id!=="all") selectedLoggers.add(Number(c.dataset.id))});
                } else {
                    const numId=Number(id);
                    selectedLoggers.has(numId)?selectedLoggers.delete(numId):selectedLoggers.add(numId);
                }

                // Update styles
                loggerChips.querySelectorAll(".chip").forEach(c=>{
                    const cid=c.dataset.id;
                    c.classList.remove("bg-blue-500","text-white","dark:bg-blue-600","dark:text-white","border-4","border-blue-500","dark:border-blue-600");
                    if(cid!=="all" && selectedLoggers.has(Number(cid))) c.classList.add("bg-blue-500","text-white","dark:bg-blue-600","dark:text-white");
                });

                updateChips();

                messages.innerHTML="";
                for(const sid of selectedLoggers) (messageCache[sid]||[]).forEach(m=>renderMessage(m.id,m.msg));
                updateStats();
            });

            /* --------------------- Clear logs --------------------- */
            clearBtn.onclick = ()=>{
                messages.innerHTML="";
                selectedLoggers.forEach(id=>messageCache[id]=[]);
                updateStats();
            };

            /* --------------------- WebSocket --------------------- */
            function connectWebSocket(url){
                if(ws && ws.readyState===WebSocket.OPEN){ ws.close(); return; }
                ws=new WebSocket(url);
                ws.binaryType="arraybuffer";
                ws.onopen=()=>{ addMessageToCache(65535,"Connected"); status.textContent="Connected"; };
                ws.onclose=()=>{ addMessageToCache(65535,"Closed"); status.textContent="Disconnected"; };
                ws.onerror=()=>addMessageToCache(65535,"Error");
                ws.onmessage = e => {
                    recvCount++;
                    if (e.data instanceof ArrayBuffer) {
                        const bytes = new Uint8Array(e.data);

                        // DEBUG: Print all bytes in hex; DO NOT REMOVE
                        // const hexString = Array.from(bytes)
                        //     .map(b => b.toString(16).padStart(2, '0'))
                        //     .join(' ');
                        // console.log(hexString);

                        if (bytes.length >= 23) { // minimum size check
                            // 1. Logger ID (big-endian)
                            const loggerId = (bytes[0] << 8) | bytes[1];

                            // 2. Line number (big-endian)
                            const lineNumber = (bytes[2] << 8) | bytes[3];

                            // 3. Function name length (big-endian)
                            const funcLen = (bytes[4] << 8) | bytes[5];

                            // 4. File name length (big-endian)
                            const fileLen = (bytes[6] << 8) | bytes[7];

                            // 5. Time
                            const year = (bytes[8] << 8) | bytes[9];
                            const month = bytes[10];
                            const day = bytes[11];
                            const hour = bytes[12];
                            const minute = bytes[13];
                            const second = bytes[14];
                            const timestamp = `[${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')} ${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:${String(second).padStart(2,'0')}]`;

                            // 6. Log level (up to 8 bytes)
                            const logLevelBytes = bytes.slice(15, 23);
                            const logLevel = new TextDecoder().decode(logLevelBytes).trim();

                            // 7. Function Name
                            const funcStart = 23;
                            const funcEnd = funcStart + funcLen;
                            const funcName = new TextDecoder().decode(bytes.slice(funcStart, funcEnd));

                            // 8. File Name
                            const fileStart = funcEnd;
                            const fileEnd = fileStart + fileLen;
                            const fileName = new TextDecoder().decode(bytes.slice(fileStart, fileEnd));

                            // 9. Message
                            const msgStart = fileEnd;
                            const message = new TextDecoder().decode(bytes.slice(msgStart));

                            // Combine formatted log
                            const formattedMsg = `${timestamp} [${logLevel}] ${fileName}:${lineNumber} ${funcName} ${message}`;

                            // Add to cache & render
                            addMessageToCache(loggerId, formattedMsg);
                            updateStats();
                        }
                    }
                };

            }

            /* --------------------- Init --------------------- */
            sortChips();
            // select all by default
            loggerChips.querySelectorAll(".chip").forEach(c=>{if(c.dataset.id!=="all") selectedLoggers.add(Number(c.dataset.id));});
            updateChips();
            updateStats();
            connectWebSocket(`ws://localhost:{{port}}/ws`);
        </script>
    </body>
</html>
