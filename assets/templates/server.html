<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8">
    <title>Logger Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }

        .terminal {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                "Liberation Mono", "Courier New", monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .chip {
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip-selected {
            background-color: #3b82f6;
            /* Tailwind blue-500 */
            color: white;
        }
    </style>
</head>

<body class="bg-zinc-50 dark:bg-zinc-900 h-screen flex flex-col text-zinc-800 dark:text-zinc-200">

    <!-- Header -->
    <header
        class="p-4 bg-zinc-200 dark:bg-zinc-800 border-b border-zinc-300 dark:border-zinc-700 flex items-center justify-between">
        <h1 class="font-semibold text-lg">Logger Dashboard</h1>
        <div class="flex items-center space-x-2">
            <button id="themeToggle"
                class="px-3 py-1 rounded text-sm bg-zinc-300 dark:bg-zinc-700 hover:bg-zinc-400 dark:hover:bg-zinc-600">
                Light
            </button>
            <button id="clearBtn"
                class="px-3 py-1 rounded text-sm bg-zinc-300 dark:bg-zinc-700 hover:bg-zinc-400 dark:hover:bg-zinc-600">
                Clear Logs
            </button>
            <div id="status" class="px-3 py-1 rounded text-sm bg-zinc-300 dark:bg-zinc-700">
                Disconnected
            </div>
        </div>
    </header>

    <!-- Logger chips -->
    <div id="loggerChips"
        class="p-3 bg-zinc-100 dark:bg-zinc-800 flex flex-wrap gap-2 border-b border-zinc-300 dark:border-zinc-700">

        <!-- Meta chip -->
        <div class="chip px-3 py-1 rounded-full border border-zinc-400 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-200 text-sm"
            data-id="65535">
            Meta
        </div>

        <!-- Logger chips from template -->
        {{#m_loggers}}
        <div class="chip px-3 py-1 rounded-full border border-zinc-400 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-200 text-sm"
            data-id="{{id}}">
            {{name}}
        </div>
        {{/m_loggers}}
    </div>

    <!-- Stats -->
    <div
        class="p-2 bg-zinc-100 dark:bg-zinc-800 border-b border-zinc-300 dark:border-zinc-700 text-xs text-zinc-600 dark:text-zinc-400">
        <div class="flex flex-row gap-2">
            <div id="receivedLocal">Received from LoggerName: 0</div>
            <div id="receivedTotal">Received Total: 0</div>
        </div>
    </div>

    <!-- Terminal -->
    <main id="messages" class="flex-1 overflow-y-auto p-4 bg-zinc-50 dark:bg-zinc-900 terminal text-sm flex flex-col">
    </main>

    <!-- ======================== Scripts ======================== -->

    <!-- Global state and helpers -->
    <script>
        let ws, recvCount = 0;
        let selectedLoggers = new Set();
        const messageCache = {}; // { loggerId: [ {id, msg}, ... ] }


        const loggerNames = { 65535: "Meta" };

        {{#m_loggers}}
        loggerNames[{{ id }}] = "{{name}}";
        {{/m_loggers}}

        // DOM references
        const messages = document.getElementById('messages');
        const status = document.getElementById('status');
        const receivedLocal = document.getElementById('receivedLocal');
        const receivedTotal = document.getElementById('receivedTotal');
        const clearBtn = document.getElementById('clearBtn');
        const themeToggle = document.getElementById('themeToggle');
        const loggerChips = document.getElementById('loggerChips');
    </script>

    <!-- Theme handling -->
    <script>
        if (localStorage.theme === "light") {
            document.documentElement.classList.remove("dark");
            themeToggle.textContent = "Dark";
        } else {
            document.documentElement.classList.add("dark");
            themeToggle.textContent = "Light";
        }

        themeToggle.onclick = () => {
            if (document.documentElement.classList.contains("dark")) {
                document.documentElement.classList.remove("dark");
                localStorage.theme = "light";
                themeToggle.textContent = "Dark";
            } else {
                document.documentElement.classList.add("dark");
                localStorage.theme = "dark";
                themeToggle.textContent = "Light";
            }
        };
    </script>

    <!-- Message rendering and cache -->
    <script>
        clearBtn.onclick = () => {
            messages.innerHTML = "";
            for (const id of selectedLoggers) {
                messageCache[id] = [];
            }
            updateStats();
        };


        function addMessageToCache(id, msg) {
            id = Number(id);
            if (!messageCache[id]) messageCache[id] = [];
            messageCache[id].push({ id, msg });
            if (messageCache[id].length > 200) messageCache[id].shift();

            if (selectedLoggers.has(id)) {
                renderMessage(id, msg);
            }
        }

        function renderMessage(id, msg) {
            const line = document.createElement("div");
            const time = new Date().toLocaleTimeString("en-GB", { hour12: false });

            line.textContent = `[${time}] ${msg}`;
            line.className =
                "block px-2 py-1 cursor-default transition mx-0.5 bg-blue-200 dark:bg-blue-900/40 " +
                "text-blue-800 dark:text-blue-200 hover:bg-blue-300 dark:hover:bg-blue-800/60";
            messages.prepend(line);
        }

        function updateStats() {
            let total = 0;
            for (const key in messageCache) total += messageCache[key].length;

            let localCount = 0;
            const activeNames = [];
            for (const id of selectedLoggers) {
                localCount += messageCache[id]?.length || 0;
                activeNames.push(loggerNames[id] || id);
            }

            receivedLocal.textContent = `Received from [${activeNames.join(", ")}]: ${localCount}`;
            receivedTotal.textContent = `Received Total: ${total}`;
        }
    </script>

    <!-- Chip selection -->
    <script>
        loggerChips.addEventListener('click', (event) => {
            const chip = event.target.closest('.chip');
            if (!chip) return;

            const id = Number(chip.getAttribute('data-id'));

            if (selectedLoggers.has(id)) {
                selectedLoggers.delete(id);
                chip.classList.remove('bg-blue-500', 'text-white', 'dark:bg-blue-600', 'dark:text-white');
                chip.classList.add('bg-zinc-50', 'dark:bg-zinc-900', 'text-zinc-900', 'dark:text-zinc-200');
            } else {
                selectedLoggers.add(id);
                chip.classList.remove('bg-zinc-50', 'dark:bg-zinc-900', 'text-zinc-900', 'dark:text-zinc-200');
                chip.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-600', 'dark:text-white');
            }

            messages.innerHTML = "";
            for (const selectedId of selectedLoggers) {
                (messageCache[selectedId] || []).forEach(m => renderMessage(m.id, m.msg));
            }
            updateStats();
        });

    </script>

    <!-- WebSocket handling -->
    <script>
        function connectWebSocket(url) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                return;
            }

            ws = new WebSocket(url);
            ws.binaryType = "arraybuffer"; // handle binary

            ws.onopen = () => {
                addMessageToCache(65535, "Connected");
                status.textContent = "Connected";
            };
            ws.onclose = () => {
                addMessageToCache(65535, "Closed");
                status.textContent = "Disconnected";
            };
            ws.onerror = () => addMessageToCache(65535, "Error");
            ws.onmessage = (e) => {
                recvCount++;
                if (typeof e.data === "string") {
                    const delimiterIndex = e.data.indexOf('-');
                    if (delimiterIndex !== -1) {
                        const id = e.data.substring(0, delimiterIndex);
                        const msg = e.data.substring(delimiterIndex + 1);
                        addMessageToCache(id, msg);
                    }
                } else if (e.data instanceof ArrayBuffer) {
                    const bytes = new Uint8Array(e.data);
                    if (bytes.length >= 2) {
                        const id = (bytes[0] << 8) | bytes[1];
                        const msg = new TextDecoder().decode(bytes.subarray(2));
                        addMessageToCache(String(id), msg);
                    }
                }
                updateStats();
            };
        }

        // Default select first non-meta chip
        const defaultChip = loggerChips.querySelector('.chip[data-id="65535"]');
        if (defaultChip) {
            defaultChip.classList.remove('bg-zinc-50', 'dark:bg-zinc-900', 'text-zinc-900', 'dark:text-zinc-200');
            defaultChip.classList.add('bg-blue-500', 'text-white', 'dark:bg-blue-600', 'dark:text-white');
            selectedLoggers.add(65535);
        }

        // Connect on load
        connectWebSocket(`ws://${window.location.host}/ws`);
    </script>
</body>

</html>
